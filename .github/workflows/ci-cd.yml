name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Unit tests plus Testcontainers integration tests (Postgres, Redis, Kafka) using the runner's Docker
      - name: Run Maven clean verify
        run: mvn -B clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  docker-package:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Continuous deployment to the Azure VM (see DEPLOYMENT-AZURE.md).
  # Runs only when the AZURE_VM_HOST, AZURE_VM_USER and AZURE_VM_SSH_KEY secrets are configured.
  deploy-azure:
    needs: docker-package
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production
    env:
      VM_HOST: ${{ secrets.AZURE_VM_HOST }}

    steps:
      - name: Skip when deployment secrets are not configured
        if: env.VM_HOST == ''
        run: echo "AZURE_VM_HOST not set; skipping deployment."

      - name: Pull latest code and rebuild on the VM
        if: env.VM_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            set -e
            cd ~/apps/vectorlink && git pull --ff-only
            cd ~/stack && docker compose up -d --build --remove-orphans vectorlink
            for i in $(seq 1 30); do
              if docker compose exec -T vectorlink wget -qO- http://localhost:9091/actuator/health | grep -q '"UP"'; then
                echo "VectorLink is healthy"; exit 0
              fi
              sleep 5
            done
            echo "VectorLink did not become healthy in time"; docker compose logs --tail 100 vectorlink; exit 1
