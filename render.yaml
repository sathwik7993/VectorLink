services:
  - type: web
    name: vectorlink
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: vectorlink-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: vectorlink-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: vectorlink-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: vectorlink-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: vectorlink-db
          property: database
      - key: REDIS_HOST
        fromService:
          name: vectorlink-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: vectorlink-redis
          type: redis
          property: port

databases:
  - name: vectorlink-db
    plan: free
    databaseName: vectorlink
    postgresMajorVersion: "15"
