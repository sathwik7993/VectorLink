<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Protected — VectorLink</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <style>
    .password-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 120px);
      padding: var(--space-6);
      position: relative;
      z-index: 2;
    }
    .password-card {
      width: 100%;
      max-width: 440px;
      padding: var(--space-8);
      text-align: center;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl), var(--shadow-glow);
    }
    .password-logo {
      font-size: var(--text-3xl);
      margin-bottom: var(--space-4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      font-weight: 700;
    }
    .password-message {
      color: var(--text-secondary);
      margin-bottom: var(--space-8);
      font-size: var(--text-base);
    }
    .password-form {
      display: flex;
      flex-direction: column;
      gap: var(--space-5);
      width: 100%;
    }
    .error-block {
      background: rgba(248, 113, 113, 0.08);
      border: 1px solid rgba(248, 113, 113, 0.2);
      color: var(--danger);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      text-align: left;
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-top: var(--space-5);
      animation: shake 0.4s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
  </style>
</head>
<body>

  <!-- ===== Background Grid (Consistent with Home) ===== -->
  <div class="hero-bg" style="position: fixed; inset: 0; z-index: 1; pointer-events: none;">
    <div class="hero-grid"></div>
  </div>

  <!-- ===== Navbar ===== -->
  <nav class="navbar" id="navbar" style="position: relative; z-index: 2;">
    <div class="container">
      <a href="index.html" class="nav-logo">
        <span class="logo-icon">⚡</span>
        <span>VectorLink</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
      </ul>
    </div>
  </nav>

  <!-- ===== Main Centered Password Page ===== -->
  <main class="password-container">
    <div class="password-card animate-slide-up">
      <div class="password-logo">
        <span class="logo-icon">⚡</span>
        <span class="text-gradient">VectorLink</span>
      </div>
      <p class="password-message">This link is password protected. Enter the password to access.</p>
      
      <form class="password-form" id="passwordForm" autocomplete="off">
        <div class="input-group">
          <input 
            type="password" 
            class="input has-icon" 
            id="passwordInput" 
            placeholder="Enter password" 
            required
            autofocus
          >
          <span class="input-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn" style="width: 100%;">
          <span id="submitText">Unlock Link</span>
          <span id="submitSpinner" class="spinner hidden"></span>
        </button>
      </form>

      <!-- Error message block (hidden by default) -->
      <div id="errorBlock" class="error-block hidden">
        <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span>
        <span id="errorText">Invalid password. Please try again.</span>
      </div>
    </div>
  </main>

  <!-- ===== Footer ===== -->
  <footer class="footer" style="position: relative; z-index: 2; margin-top: auto;">
    <div class="container">
      <div class="footer-content">
        <p>© 2026 VectorLink. Built with Spring Boot, Redis, Kafka & PostgreSQL.</p>
      </div>
    </div>
  </footer>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="js/password.js"></script>
</body>
</html>
