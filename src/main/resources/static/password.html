<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Protected — VectorLink</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="This link is password protected. Enter the password to access.">
  <meta name="robots" content="noindex, nofollow">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230071E3' stroke-width='2.5'><polygon points='13 2 3 14 12 14 11 22 21 10 12 10 13 2'/></svg>">
  
  <style>
    /* ----- Modern Light Skeuomorphic Overrides ----- */
    :root {
      --bg: #F5F5F7;
      --bg-secondary: #FFFFFF;
      --surface: rgba(0, 0, 0, 0.02);
      --surface-hover: rgba(0, 0, 0, 0.04);
      --surface-border: rgba(0, 0, 0, 0.08);
      --glass: rgba(255, 255, 255, 0.75);
      --glass-border: rgba(0, 0, 0, 0.08);
      --glass-hover: rgba(255, 255, 255, 0.85);

      --accent: #0071E3;
      --accent-secondary: #0077ED;
      --gradient: linear-gradient(180deg, #3296FF 0%, #0071E3 100%);
      --gradient-text: linear-gradient(135deg, #1D1D1F 30%, #0071E3 100%);
      --gradient-subtle: linear-gradient(180deg, #FFFFFF 0%, #F5F5F7 100%);

      --text-primary: #1D1D1F;
      --text-secondary: #6E6E73;
      --text-tertiary: #86868B;

      --success: #34C759;
      --success-bg: rgba(52, 199, 89, 0.12);
      --danger: #FF3B30;
      --danger-bg: rgba(255, 59, 48, 0.12);
      --warning: #FF9500;
      --warning-bg: rgba(255, 149, 0, 0.12);
      --info: #0071E3;

      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04), 0 0 1px rgba(0,0,0,0.1);
      --shadow-md: 0 4px 14px rgba(0,0,0,0.05), 0 0 1px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.8);
      --shadow-lg: 0 10px 30px rgba(0,0,0,0.06), 0 0 1px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.9);
      --shadow-xl: 0 20px 50px rgba(0,0,0,0.08), 0 0 1px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.95);
      --shadow-glow: 0 0 15px rgba(0,113,227,0.15);
      --shadow-glow-strong: 0 0 25px rgba(0,113,227,0.25);
    }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    /* Navbar background adjustment */
    .navbar {
      background: rgba(245, 245, 247, 0.85) !important;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08) !important;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
    }
    .nav-links a {
      color: var(--text-secondary) !important;
    }
    .nav-links a:hover {
      color: var(--text-primary) !important;
    }

    .nav-logo span {
      background: var(--gradient-text);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
    }

    /* Hero adjustments */
    .hero-grid {
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 60% 50% at 50% 50%, black 40%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 60% 50% at 50% 50%, black 40%, transparent 100%);
    }

    /* Password Page Specifics */
    .password-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 120px);
      padding: var(--space-6);
      position: relative;
      z-index: 2;
    }
    .password-card {
      width: 100%;
      max-width: 440px;
      padding: var(--space-8);
      text-align: center;
      background: var(--glass) !important;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border) !important;
      border-radius: var(--radius-xl);
      box-shadow: 
        0 12px 30px rgba(0, 0, 0, 0.05), 
        inset 0 1px 0 rgba(255, 255, 255, 0.95),
        inset 0 0 0 1px rgba(255, 255, 255, 0.5) !important;
    }
    .password-logo {
      font-size: var(--text-3xl);
      margin-bottom: var(--space-4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      font-weight: 700;
    }
    .password-message {
      color: var(--text-secondary);
      margin-bottom: var(--space-8);
      font-size: var(--text-base);
    }
    .password-form {
      display: flex;
      flex-direction: column;
      gap: var(--space-5);
      width: 100%;
    }

    /* Input styling - inset, clean border */
    .input {
      background: #FFFFFF !important;
      border: 1px solid rgba(0, 0, 0, 0.15) !important;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.06) !important;
      color: var(--text-primary) !important;
      border-radius: var(--radius-lg);
      width: 100%;
      padding: var(--space-4) var(--space-5);
      padding-left: calc(var(--space-4) + 24px) !important;
      font-size: var(--text-base);
      outline: none;
      transition: all 0.2s ease-in-out;
    }
    .input:hover {
      border-color: rgba(0, 0, 0, 0.25) !important;
    }
    .input:focus {
      border-color: var(--accent) !important;
      box-shadow: 
        0 0 0 3.5px rgba(0, 113, 227, 0.18), 
        inset 0 1px 2px rgba(0, 0, 0, 0.05) !important;
    }
    .input:focus ~ .input-icon {
      color: var(--accent) !important;
    }

    /* Primary Button - Glossy Skeuomorphic Blue */
    .btn-primary {
      background: linear-gradient(180deg, #3597FF 0%, #0071E3 100%) !important;
      border: 1px solid #0066CC !important;
      color: #FFFFFF !important;
      box-shadow: 
        0 2px 4px rgba(0, 113, 227, 0.2), 
        inset 0 1px 0 rgba(255, 255, 255, 0.3) !important;
      text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.15);
      border-radius: var(--radius-lg);
    }
    .btn-primary:hover {
      background: linear-gradient(180deg, #4DA3FF 0%, #007BF2 100%) !important;
      border-color: #0071E3 !important;
      box-shadow: 
        0 4px 8px rgba(0, 113, 227, 0.25), 
        inset 0 1px 0 rgba(255, 255, 255, 0.4) !important;
    }
    .btn-primary:active {
      background: linear-gradient(180deg, #0066CC 0%, #005BB8 100%) !important;
      box-shadow: inset 0 1.5px 3px rgba(0, 0, 0, 0.2) !important;
      transform: scale(0.98);
    }

    .error-block {
      background: var(--danger-bg) !important;
      border: 1px solid rgba(255, 59, 48, 0.2) !important;
      color: var(--danger) !important;
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      text-align: left;
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-top: var(--space-5);
      animation: shake 0.4s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    /* Footer elements */
    .footer {
      border-top: 1px solid rgba(0, 0, 0, 0.08) !important;
    }
    .footer p {
      color: var(--text-tertiary) !important;
    }
  </style>
</head>
<body>

  <!-- ===== Background Grid (Consistent with Home) ===== -->
  <div class="hero-bg" style="position: fixed; inset: 0; z-index: 1; pointer-events: none;">
    <div class="hero-grid"></div>
  </div>

  <!-- ===== Navbar ===== -->
  <nav class="navbar" id="navbar" style="position: relative; z-index: 2;">
    <div class="container">
      <a href="index.html" class="nav-logo">
        <span class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent); vertical-align: middle;"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        </span>
        <span>VectorLink</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
      </ul>
    </div>
  </nav>

  <!-- ===== Main Centered Password Page ===== -->
  <main class="password-container">
    <div class="password-card animate-slide-up">
      <div class="password-logo">
        <span class="logo-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent); vertical-align: middle;"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        </span>
        <span class="text-gradient">VectorLink</span>
      </div>
      <p class="password-message">This link is password protected. Enter the password to access.</p>
      
      <form class="password-form" id="passwordForm" autocomplete="off">
        <div class="input-group">
          <input 
            type="password" 
            class="input has-icon" 
            id="passwordInput" 
            placeholder="Enter password" 
            required
            autofocus
          >
          <span class="input-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn" style="width: 100%;">
          <span id="submitText">Unlock Link</span>
          <span id="submitSpinner" class="spinner hidden"></span>
        </button>
      </form>

      <!-- Error message block (hidden by default) -->
      <div id="errorBlock" class="error-block hidden">
        <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span>
        <span id="errorText">Invalid password. Please try again.</span>
      </div>
    </div>
  </main>

  <!-- ===== Footer ===== -->
  <footer class="footer" style="position: relative; z-index: 2; margin-top: auto;">
    <div class="container">
      <div class="footer-content">
        <p>© 2026 VectorLink. Built with Spring Boot, Redis, Kafka & PostgreSQL.</p>
      </div>
    </div>
  </footer>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="js/password.js"></script>
</body>
</html>
