<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — VectorLink</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="Create an account on VectorLink to manage URLs and view advanced analytics.">
  <meta name="robots" content="noindex, nofollow">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230071E3' stroke-width='2.5'><polygon points='13 2 3 14 12 14 11 22 21 10 12 10 13 2'/></svg>">
  
  <style>
    /* ----- Modern Light Skeuomorphic Overrides ----- */
    :root {
      --bg: #F5F5F7;
      --bg-secondary: #FFFFFF;
      --surface: rgba(0, 0, 0, 0.02);
      --surface-hover: rgba(0, 0, 0, 0.04);
      --surface-border: rgba(0, 0, 0, 0.08);
      --glass: rgba(255, 255, 255, 0.75);
      --glass-border: rgba(0, 0, 0, 0.08);
      --glass-hover: rgba(255, 255, 255, 0.85);

      --accent: #0071E3;
      --accent-secondary: #0077ED;
      --gradient: linear-gradient(180deg, #3296FF 0%, #0071E3 100%);
      --gradient-text: linear-gradient(135deg, #1D1D1F 30%, #0071E3 100%);
      --gradient-subtle: linear-gradient(180deg, #FFFFFF 0%, #F5F5F7 100%);

      --text-primary: #1D1D1F;
      --text-secondary: #6E6E73;
      --text-tertiary: #86868B;

      --success: #34C759;
      --success-bg: rgba(52, 199, 89, 0.12);
      --danger: #FF3B30;
      --danger-bg: rgba(255, 59, 48, 0.12);
      --warning: #FF9500;
      --warning-bg: rgba(255, 149, 0, 0.12);
      --info: #0071E3;

      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04), 0 0 1px rgba(0,0,0,0.1);
      --shadow-md: 0 4px 14px rgba(0,0,0,0.05), 0 0 1px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.8);
      --shadow-lg: 0 10px 30px rgba(0,0,0,0.06), 0 0 1px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.9);
      --shadow-xl: 0 20px 50px rgba(0,0,0,0.08), 0 0 1px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.95);
      --shadow-glow: 0 0 15px rgba(0,113,227,0.15);
      --shadow-glow-strong: 0 0 25px rgba(0,113,227,0.25);
    }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    /* Navbar background adjustment */
    .navbar {
      background: rgba(245, 245, 247, 0.85) !important;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08) !important;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
    }
    .navbar.scrolled {
      background: rgba(255, 255, 255, 0.95) !important;
      border-bottom-color: rgba(0, 0, 0, 0.12) !important;
    }
    .nav-links a {
      color: var(--text-secondary) !important;
    }
    .nav-links a:hover, .nav-links a.active {
      color: var(--text-primary) !important;
    }

    .nav-logo span {
      background: var(--gradient-text);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
    }

    /* Hero adjustments */
    .hero-grid {
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 60% 50% at 50% 50%, black 40%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 60% 50% at 50% 50%, black 40%, transparent 100%);
    }
    .hero-bg::before {
      background: radial-gradient(circle, rgba(0, 113, 227, 0.06) 0%, transparent 70%);
    }
    .hero-bg::after {
      background: radial-gradient(circle, rgba(0, 113, 227, 0.04) 0%, transparent 70%);
    }

    /* Auth Card layout */
    .auth-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - var(--nav-height) - 100px);
      padding: var(--space-4);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      padding: var(--space-8);
      border-radius: var(--radius-xl);
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      box-shadow: 
        0 12px 30px rgba(0, 0, 0, 0.05), 
        inset 0 1px 0 rgba(255, 255, 255, 0.95),
        inset 0 0 0 1px rgba(255, 255, 255, 0.5) !important;
    }
    .auth-card h2 {
      margin-bottom: var(--space-2);
      font-size: var(--text-3xl);
      text-align: center;
      font-weight: 700;
    }
    .auth-card p {
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: var(--space-6);
      font-size: var(--text-sm);
    }
    .form-group {
      margin-bottom: var(--space-4);
    }
    .form-label {
      display: block;
      margin-bottom: var(--space-2);
      font-size: var(--text-sm);
      color: var(--text-secondary);
      font-weight: 500;
      text-align: left;
    }
    
    /* Input styling - inset, clean border */
    .input {
      background: #FFFFFF !important;
      border: 1px solid rgba(0, 0, 0, 0.15) !important;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.06) !important;
      color: var(--text-primary) !important;
      border-radius: var(--radius-lg);
      width: 100%;
      padding: var(--space-4) var(--space-5);
      font-size: var(--text-base);
      outline: none;
      transition: all 0.2s ease-in-out;
    }
    .input::placeholder {
      color: var(--text-tertiary);
    }
    .input:hover {
      border-color: rgba(0, 0, 0, 0.25) !important;
    }
    .input:focus {
      border-color: var(--accent) !important;
      box-shadow: 
        0 0 0 3.5px rgba(0, 113, 227, 0.18), 
        inset 0 1px 2px rgba(0, 0, 0, 0.05) !important;
    }

    /* Primary Button - Glossy Skeuomorphic Blue */
    .btn-primary {
      background: linear-gradient(180deg, #3597FF 0%, #0071E3 100%) !important;
      border: 1px solid #0066CC !important;
      color: #FFFFFF !important;
      box-shadow: 
        0 2px 4px rgba(0, 113, 227, 0.2), 
        inset 0 1px 0 rgba(255, 255, 255, 0.3) !important;
      text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.15);
      border-radius: var(--radius-lg);
    }
    .btn-primary:hover {
      background: linear-gradient(180deg, #4DA3FF 0%, #007BF2 100%) !important;
      border-color: #0071E3 !important;
      box-shadow: 
        0 4px 8px rgba(0, 113, 227, 0.25), 
        inset 0 1px 0 rgba(255, 255, 255, 0.4) !important;
    }
    .btn-primary:active {
      background: linear-gradient(180deg, #0066CC 0%, #005BB8 100%) !important;
      box-shadow: inset 0 1.5px 3px rgba(0, 0, 0, 0.2) !important;
      transform: scale(0.98);
    }
    
    .error-msg {
      background: var(--danger-bg);
      color: var(--danger);
      padding: var(--space-3);
      border-radius: var(--radius-sm);
      font-size: var(--text-sm);
      margin-bottom: var(--space-4);
      display: none;
      border: 1px solid rgba(255, 59, 48, 0.2);
    }
    .success-msg {
      background: var(--success-bg);
      color: var(--success);
      padding: var(--space-3);
      border-radius: var(--radius-sm);
      font-size: var(--text-sm);
      margin-bottom: var(--space-4);
      display: none;
      border: 1px solid rgba(52, 199, 89, 0.2);
    }
    .auth-links {
      text-align: center;
      margin-top: var(--space-4);
      font-size: var(--text-sm);
      color: var(--text-secondary);
    }
    .auth-links a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .auth-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- ===== Navbar ===== -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <a href="index.html" class="nav-logo">
        <span class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent); vertical-align: middle;"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        </span>
        <span>VectorLink</span>
      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="register.html" class="active">Register</a></li>
      </ul>
    </div>
  </nav>

  <div class="hero">
    <div class="hero-bg">
      <div class="hero-grid"></div>
    </div>
    
    <div class="auth-container">
      <div class="auth-card">
        <h2>Create <span class="text-gradient">Account</span></h2>
        <p>Register to unlock secure link management features</p>

        <div id="errorMsg" class="error-msg"></div>
        <div id="successMsg" class="success-msg"></div>

        <form id="registerForm" autocomplete="off">
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" class="input" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="input" placeholder="Min 6 characters" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" class="input" placeholder="Re-enter password" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--space-4);" id="registerBtn">
            <span>Sign Up</span>
          </button>
        </form>

        <div class="auth-links">
          Already have an account? <a href="login.html">Sign In</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errorMsg = document.getElementById('errorMsg');
      const successMsg = document.getElementById('successMsg');
      const registerBtn = document.getElementById('registerBtn');
      
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';
      
      if (password !== confirmPassword) {
        errorMsg.textContent = 'Passwords do not match';
        errorMsg.style.display = 'block';
        return;
      }

      if (password.length < 6) {
        errorMsg.textContent = 'Password must be at least 6 characters long';
        errorMsg.style.display = 'block';
        return;
      }

      registerBtn.disabled = true;

      try {
        const res = await fetch('/api/v1/auth/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });
        
        const data = await res.json();
        if (res.ok || res.status === 201) {
          successMsg.textContent = 'Registration successful! Redirecting to login...';
          successMsg.style.display = 'block';
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 1500);
        } else {
          errorMsg.textContent = data.message || 'Registration failed';
          errorMsg.style.display = 'block';
          registerBtn.disabled = false;
        }
      } catch (err) {
        errorMsg.textContent = 'An error occurred. Please try again.';
        errorMsg.style.display = 'block';
        registerBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
