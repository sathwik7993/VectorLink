<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — VectorLink</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <style>
    .auth-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - var(--nav-height) - 100px);
      padding: var(--space-4);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      padding: var(--space-8);
      border-radius: var(--radius-lg);
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow-lg), var(--shadow-glow);
    }
    .auth-card h2 {
      margin-bottom: var(--space-2);
      font-size: var(--text-3xl);
      text-align: center;
    }
    .auth-card p {
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: var(--space-6);
      font-size: var(--text-sm);
    }
    .form-group {
      margin-bottom: var(--space-4);
    }
    .form-label {
      display: block;
      margin-bottom: var(--space-2);
      font-size: var(--text-sm);
      color: var(--text-secondary);
    }
    .error-msg {
      background: var(--danger-bg);
      color: var(--danger);
      padding: var(--space-3);
      border-radius: var(--radius-sm);
      font-size: var(--text-sm);
      margin-bottom: var(--space-4);
      display: none;
      border: 1px solid rgba(248, 113, 113, 0.2);
    }
    .success-msg {
      background: var(--success-bg);
      color: var(--success);
      padding: var(--space-3);
      border-radius: var(--radius-sm);
      font-size: var(--text-sm);
      margin-bottom: var(--space-4);
      display: none;
      border: 1px solid rgba(52, 211, 153, 0.2);
    }
    .auth-links {
      text-align: center;
      margin-top: var(--space-4);
      font-size: var(--text-sm);
      color: var(--text-secondary);
    }
    .auth-links a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .auth-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- ===== Navbar ===== -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <a href="index.html" class="nav-logo">
        <span class="logo-icon">⚡</span>
        <span>VectorLink</span>
      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="register.html" class="active">Register</a></li>
      </ul>
    </div>
  </nav>

  <div class="hero">
    <div class="hero-bg">
      <div class="hero-grid"></div>
    </div>
    
    <div class="auth-container">
      <div class="auth-card">
        <h2>Create <span class="text-gradient">Account</span></h2>
        <p>Register to unlock secure link management features</p>

        <div id="errorMsg" class="error-msg"></div>
        <div id="successMsg" class="success-msg"></div>

        <form id="registerForm" autocomplete="off">
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" class="input" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="input" placeholder="Min 6 characters" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" class="input" placeholder="Re-enter password" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--space-4);" id="registerBtn">
            <span>Sign Up</span>
          </button>
        </form>

        <div class="auth-links">
          Already have an account? <a href="login.html">Sign In</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errorMsg = document.getElementById('errorMsg');
      const successMsg = document.getElementById('successMsg');
      const registerBtn = document.getElementById('registerBtn');
      
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';
      
      if (password !== confirmPassword) {
        errorMsg.textContent = 'Passwords do not match';
        errorMsg.style.display = 'block';
        return;
      }

      if (password.length < 6) {
        errorMsg.textContent = 'Password must be at least 6 characters long';
        errorMsg.style.display = 'block';
        return;
      }

      registerBtn.disabled = true;

      try {
        const res = await fetch('/api/v1/auth/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });
        
        const data = await res.json();
        if (res.ok || res.status === 201) {
          successMsg.textContent = 'Registration successful! Redirecting to login...';
          successMsg.style.display = 'block';
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 1500);
        } else {
          errorMsg.textContent = data.message || 'Registration failed';
          errorMsg.style.display = 'block';
          registerBtn.disabled = false;
        }
      } catch (err) {
        errorMsg.textContent = 'An error occurred. Please try again.';
        errorMsg.style.display = 'block';
        registerBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
