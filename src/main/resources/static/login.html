<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — VectorLink</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <style>
    .auth-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - var(--nav-height) - 100px);
      padding: var(--space-4);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      padding: var(--space-8);
      border-radius: var(--radius-lg);
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow-lg), var(--shadow-glow);
    }
    .auth-card h2 {
      margin-bottom: var(--space-2);
      font-size: var(--text-3xl);
      text-align: center;
    }
    .auth-card p {
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: var(--space-6);
      font-size: var(--text-sm);
    }
    .form-group {
      margin-bottom: var(--space-4);
    }
    .form-label {
      display: block;
      margin-bottom: var(--space-2);
      font-size: var(--text-sm);
      color: var(--text-secondary);
    }
    .social-auth {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      margin-top: var(--space-6);
      border-top: 1px solid var(--surface-border);
      padding-top: var(--space-6);
    }
    .btn-social {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-3);
      background: var(--surface);
      border: 1px solid var(--surface-border);
      color: var(--text-primary);
      width: 100%;
      padding: 12px;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-weight: 500;
      transition: var(--transition);
      text-decoration: none;
    }
    .btn-social:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
      box-shadow: var(--shadow-glow);
    }
    .error-msg {
      background: var(--danger-bg);
      color: var(--danger);
      padding: var(--space-3);
      border-radius: var(--radius-sm);
      font-size: var(--text-sm);
      margin-bottom: var(--space-4);
      display: none;
      border: 1px solid rgba(248, 113, 113, 0.2);
    }
    .success-msg {
      background: var(--success-bg);
      color: var(--success);
      padding: var(--space-3);
      border-radius: var(--radius-sm);
      font-size: var(--text-sm);
      margin-bottom: var(--space-4);
      display: none;
      border: 1px solid rgba(52, 211, 153, 0.2);
    }
    .auth-links {
      text-align: center;
      margin-top: var(--space-4);
      font-size: var(--text-sm);
      color: var(--text-secondary);
    }
    .auth-links a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .auth-links a:hover {
      text-decoration: underline;
    }
    .divider {
      text-align: center;
      position: relative;
      margin: var(--space-6) 0;
      color: var(--text-tertiary);
      font-size: var(--text-xs);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .divider::before, .divider::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: var(--surface-border);
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }
  </style>
</head>
<body>

  <!-- ===== Navbar ===== -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <a href="index.html" class="nav-logo">
        <span class="logo-icon">⚡</span>
        <span>VectorLink</span>
      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="login.html" class="active">Login</a></li>
        <li><a href="register.html">Register</a></li>
      </ul>
    </div>
  </nav>

  <div class="hero">
    <div class="hero-bg">
      <div class="hero-grid"></div>
    </div>
    
    <div class="auth-container">
      <div class="auth-card">
        <h2>Welcome <span class="text-gradient">Back</span></h2>
        <p>Sign in to manage and track your links</p>

        <div id="errorMsg" class="error-msg"></div>
        <div id="successMsg" class="success-msg"></div>

        <form id="loginForm" autocomplete="on">
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" class="input" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="input" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--space-4);" id="loginBtn">
            <span>Sign In</span>
          </button>
        </form>

        <div class="auth-links">
          Don't have an account? <a href="register.html">Sign Up</a>
        </div>

        <div class="divider">or continue with</div>

        <div class="social-auth">
          <a href="/oauth2/authorization/google" class="btn-social">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M12.24 10.285V14.4h6.887c-.648 2.41-2.519 4.114-5.136 4.114A5.79 5.79 0 0 1 8.2 12.725a5.79 5.79 0 0 1 5.79-5.79c2.327 0 4.159 1.341 4.954 3.092l3.414-1.707C21.066 5.568 17.848 3 13.99 3c-5.362 0-9.708 4.346-9.708 9.709s4.346 9.709 9.709 9.709c5.27 0 9.53-3.834 9.53-9.709 0-.64-.069-1.127-.168-1.424z"/></svg>
            Google
          </a>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      const successMsg = document.getElementById('successMsg');
      const loginBtn = document.getElementById('loginBtn');
      
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';
      loginBtn.disabled = true;

      try {
        const res = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });
        
        const data = await res.json();
        if (res.ok) {
          successMsg.textContent = 'Login successful! Redirecting...';
          successMsg.style.display = 'block';
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 1000);
        } else {
          errorMsg.textContent = data.message || 'Invalid email or password';
          errorMsg.style.display = 'block';
          loginBtn.disabled = false;
        }
      } catch (err) {
        errorMsg.textContent = 'An error occurred. Please try again.';
        errorMsg.style.display = 'block';
        loginBtn.disabled = false;
      }
    });

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('error')) {
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.textContent = urlParams.get('error');
      errorMsg.style.display = 'block';
    }
  </script>
</body>
</html>
