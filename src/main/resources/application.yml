app:
  kafka:
    enabled: true
    # Overflow log used when Kafka is down and the in-memory buffer is full; replayed on recovery
    dead-letter-log-path: ${DEAD_LETTER_LOG_PATH:logs/dead_letter_clicks.log}
  jwt:
    # Local development default only. application-prod.yml requires JWT_SECRET to be set.
    secret: ${JWT_SECRET:local-dev-only-jwt-secret-do-not-use-in-production}

spring:
  application:
    name: url-shortener

  # OAuth2 Client Configuration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret}
            scope:
              - email
              - profile

  # 1. PostgreSQL Datasource
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/url_shortener
    username: ${DB_USER:postgres}
    password: ${DB_PASS:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  # 2. JPA & Hibernate
  jpa:
    hibernate:
      ddl-auto: validate # Database schema is initialized via SQL scripts, JPA only validates compatibility
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  # 3. Redis Cache & Sequence Gen
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS:}
      timeout: 2000ms

  # 4. Kafka Broker Config
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: url-analytics-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "com.shortener.dto,com.shortener.entity,java.util,java.time"

# 5. Logging Configuration
logging:
  level:
    root: INFO
    com.shortener: INFO
    org.springframework.cache: WARN

# 6. Actuator — served on a separate internal port that is never published or proxied publicly
management:
  server:
    port: ${MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
