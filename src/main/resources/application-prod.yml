# =============================================================================
# VectorLink — Production Profile
# Activated via: SPRING_PROFILES_ACTIVE=prod
# =============================================================================

app:
  # The Azure stack runs a single-node KRaft Kafka broker (infrastructure/azure/docker-compose.yml).
  # Set KAFKA_ENABLED=false on hosts without a broker: all Kafka beans/listeners/schedulers are then
  # disabled and UrlShortenerService.trackClick() writes click events straight to Postgres.
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    dead-letter-log-path: ${DEAD_LETTER_LOG_PATH:/tmp/vectorlink/dead_letter_clicks.log}
  jwt:
    # Required in production; no default, so the app refuses to start without it
    secret: ${JWT_SECRET}

spring:

  # PostgreSQL — all values injected from platform environment variables
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:vectorlink}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000

  # JPA — validate only; schema managed by migration scripts
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Kafka
  kafka:
    bootstrap-servers: ${KAFKA_HOST:kafka}:${KAFKA_PORT:9092}

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS:}
      timeout: 2000ms

# Logging — keep production logs lean
logging:
  level:
    root: WARN
    com.shortener: INFO
    org.springframework: WARN
    org.hibernate: WARN

# Server tuning
server:
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain
    min-response-size: 1024
  max-http-header-size: 16KB

# Actuator — internal management port only (Caddy proxies 8080, never 9091)
management:
  server:
    port: ${MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
