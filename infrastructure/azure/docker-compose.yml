# One Azure VM, two apps. Layout on the VM:
#   ~/stack/                docker-compose.yml, Caddyfile, .env, init-db/
#   ~/apps/vectorlink/      git clone of VectorLink
#   ~/apps/designlab/       git clone of ArchSim (DesignLab)
# Run from ~/stack:  docker compose up -d --build
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 60m

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro   # runs on first start of empty volume only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
    mem_limit: 300m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 64mb --maxmemory-policy allkeys-lru --save 60 1
    volumes: [redis_data:/data]
    mem_limit: 100m

  # Single-node KRaft broker for the click analytics pipeline (no ZooKeeper).
  # Topic data lives in the container; unconsumed events are lost if the container is recreated.
  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    mem_limit: 512m

  vectorlink:
    build: ../apps/vectorlink
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_NAME: vectorlink
      DB_USER: postgres
      DB_PASS: ${PG_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASS: ${REDIS_PASSWORD}
      KAFKA_ENABLED: "true"
      KAFKA_HOST: kafka
      KAFKA_PORT: 9092
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JAVA_OPTS: "-Xmx350m -XX:+UseSerialGC"
    mem_limit: 600m

  archsim-backend:
    build: ../apps/designlab/backend
    restart: unless-stopped
    networks:
      default:
        aliases: [backend]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/archsim
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ${PG_PASSWORD}
      ARCHSIM_TOKEN_SECRET: ${ARCHSIM_TOKEN_SECRET}
      ARCHSIM_ALLOWED_ORIGINS: https://arch-sim.dev
      SPRING_PROFILES_ACTIVE: prod
      PORT: "8080"
      JAVA_TOOL_OPTIONS: "-Xmx350m -XX:+UseSerialGC"
    mem_limit: 600m

  # The frontend nginx proxies /api and /ws to host "backend", so alias it.
  archsim-frontend:
    build: ../apps/designlab/frontend
    restart: unless-stopped
    depends_on: [archsim-backend]
    mem_limit: 50m

volumes:
  pg_data:
  caddy_data:
  caddy_config:
  redis_data:
